services:
  leafdoc:
    build:
      context: .
      dockerfile: Dockerfile
    image: leafdoc-ai:latest
    container_name: leafdoc-server
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    volumes:
      - ./checkpoints:/app/checkpoints:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
